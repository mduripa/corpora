<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Corpara · 3D Human Anatomy</title>
<link rel="icon" href="icons/logo.png">
<link rel="manifest" href="corpara.webmanifest">
<link rel="apple-touch-icon" href="icons/app-192.png">
<meta name="theme-color" content="#101628">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ease:cubic-bezier(.32,.72,0,1);--spring:cubic-bezier(.34,1.36,.64,1);
  --text:#f5f5f7;--text2:#a1a1a6;--text3:#6e6e73;--sep:rgba(255,255,255,.09);--fill:rgba(255,255,255,.065);--fill2:rgba(255,255,255,.11);
  --accent:#0a84ff;--glass:rgba(40,40,46,.62);--glass2:rgba(30,30,34,.78);
  --muted:var(--text2);--ink:var(--text);--soft:var(--fill);--line:var(--sep);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(1200px 800px at 12% 8%,#3b2a6b 0%,transparent 60%),radial-gradient(1000px 700px at 90% 20%,#0d4f7a 0%,transparent 55%),radial-gradient(900px 700px at 60% 100%,#6b2340 0%,transparent 55%),#0b0f1e;}
button,input{font:inherit;color:inherit}
button{cursor:default;border:0;background:none;-webkit-user-select:none;user-select:none}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:10px;border:3px solid transparent;background-clip:content-box}::-webkit-scrollbar-track{background:transparent}

/* ===== window ===== */
.win{position:fixed;inset:12px;border-radius:14px;overflow:hidden;display:grid;grid-template-columns:1fr 372px;grid-template-rows:52px 1fr;
  background:rgba(22,22,26,.55);box-shadow:0 0 0 .5px rgba(255,255,255,.14) inset,0 0 0 1px rgba(0,0,0,.6),0 30px 90px rgba(0,0,0,.55);
  backdrop-filter:blur(40px) saturate(170%);-webkit-backdrop-filter:blur(40px) saturate(170%);transition:grid-template-columns .5s var(--ease)}
.win.noinsp{grid-template-columns:1fr 0px}
.win.full{inset:0;border-radius:0}
.titlebar{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 14px 0 18px;border-bottom:.5px solid rgba(0,0,0,.55);box-shadow:0 .5px 0 rgba(255,255,255,.06);
  background:linear-gradient(rgba(58,58,64,.55),rgba(44,44,50,.55));-webkit-user-select:none;user-select:none;position:relative;z-index:8}
.lights{display:flex;gap:8px;margin-right:6px}
.lights button{width:12px;height:12px;border-radius:50%;position:relative;box-shadow:0 0 0 .5px rgba(0,0,0,.35) inset;display:grid;place-items:center;font-size:9px;line-height:1;color:transparent;font-weight:900}
.lights .r{background:linear-gradient(160deg,#f06a7e,#c8304a)}.lights .y{background:linear-gradient(160deg,#8fa3c7,#5a6d92)}.lights .g{background:linear-gradient(160deg,#4aa8ff,#0a6fd6)}
.lights button{box-shadow:0 0 0 .5px rgba(255,255,255,.18) inset,0 1px 3px rgba(0,0,0,.35)}
.lights:hover button{color:rgba(255,255,255,.92)}
.appname{display:flex;align-items:center;gap:9px;font-weight:700;font-size:13.5px;letter-spacing:-.1px}
.appname img{width:24px;height:24px;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.appname small{font-weight:500;color:var(--text2);font-size:12px}
.spacer{flex:1}
.seg{display:flex;background:rgba(0,0,0,.28);border-radius:8px;padding:2px;box-shadow:0 0 0 .5px rgba(255,255,255,.08) inset;position:relative}
.seg button{position:relative;z-index:1;padding:4px 12px;border-radius:6px;font-size:12px;font-weight:600;color:var(--text2);white-space:nowrap;transition:color .25s var(--ease)}
.seg button.on{color:#fff}
.seg .thumb{position:absolute;top:2px;bottom:2px;border-radius:6px;background:rgba(255,255,255,.17);box-shadow:0 1px 3px rgba(0,0,0,.35),0 0 0 .5px rgba(255,255,255,.12) inset;transition:left .35s var(--spring),width .35s var(--spring)}

/* ===== stage ===== */
#stage{-webkit-user-select:none;user-select:none;position:relative;background:radial-gradient(ellipse at 50% 32%,#1e2f52 0%,#111b33 52%,#080d1a 100%);overflow:hidden;touch-action:none}
#stage canvas{display:block;width:100%;height:100%;outline:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{transition:opacity .25s var(--ease);position:absolute;left:0;top:0;background:rgba(30,30,34,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;white-space:nowrap;box-shadow:0 0 0 .5px rgba(255,255,255,.15) inset,0 4px 12px rgba(0,0,0,.3);pointer-events:auto;display:none;animation:fadeIn .3s var(--ease)}
.glass{background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:0 0 0 .5px rgba(255,255,255,.16) inset,0 0 0 .5px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.35)}
.tools{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:2px;z-index:3;padding:5px;border-radius:14px}
.tool{width:34px;height:34px;border-radius:9px;color:#e5e5ea;display:grid;place-items:center;position:relative;transition:background .2s var(--ease),transform .2s var(--spring)}
.tool svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tool:hover{background:var(--fill2)}
.tool:active{transform:scale(.9)}
.tool.on{background:var(--accent);color:#fff}
.tool span{position:absolute;right:44px;top:50%;transform:translateY(-50%) translateX(6px);background:rgba(40,40,46,.92);backdrop-filter:blur(20px);color:#fff;font-size:11.5px;font-weight:500;padding:4px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s var(--ease) .25s,transform .25s var(--ease) .25s;box-shadow:0 0 0 .5px rgba(255,255,255,.15) inset}
.tool:hover span{opacity:1;transform:translateY(-50%)}
.tool .n{position:absolute;top:-3px;right:-3px;background:#ff453a;color:#fff;font-size:9.5px;font-weight:700;border-radius:8px;padding:1px 5px;opacity:1;transform:none;right:-3px;left:auto;box-shadow:none}
.hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);color:var(--text2);font-size:11.5px;padding:5px 11px;border-radius:999px;pointer-events:none;transition:opacity .4s var(--ease)}
.badge{position:absolute;left:14px;top:14px;color:#fff;font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 7px;border-radius:12px;pointer-events:none}
.badge img{width:24px;height:24px;object-fit:contain;transition:transform .5s var(--spring)}
.badge.bump img{transform:scale(1.25) rotate(-6deg)}
#loader{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--text);border-radius:14px;padding:16px 18px;min-width:260px;font-size:12.5px;font-weight:500;z-index:4;display:none;animation:popIn .4s var(--spring)}
#loader .row{display:flex;align-items:center;gap:10px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.18);border-top-color:#fff;animation:spin .8s linear infinite;flex:none}
#loader .bar{height:4px;background:rgba(255,255,255,.12);border-radius:4px;margin-top:11px;overflow:hidden}
#loader .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:4px;transition:width .35s var(--ease)}

/* ===== dock ===== */
#systems{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:flex-end;gap:4px;padding:6px 8px 8px;border-radius:20px;z-index:4;max-width:calc(100% - 24px)}
.chip{position:relative;display:flex;flex-direction:column;align-items:center;--s:1;transition:transform .2s var(--ease)}
.chip .dot{width:calc(var(--b,46px) * var(--s));height:calc(var(--b,46px) * var(--s));border-radius:calc(12px * var(--s));display:grid;place-items:center;transition:width .14s var(--ease),height .14s var(--ease),border-radius .14s var(--ease);overflow:hidden}
.chip .tip{position:absolute;bottom:calc(46px * var(--s) + 22px);left:50%;transform:translateX(-50%) translateY(4px);background:rgba(40,40,46,.9);backdrop-filter:blur(20px);color:#fff;font-size:12px;font-weight:500;padding:4px 10px;border-radius:7px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s,transform .2s var(--ease);box-shadow:0 0 0 .5px rgba(255,255,255,.15) inset,0 6px 16px rgba(0,0,0,.35)}
.chip:hover .tip{opacity:1;transform:translateX(-50%)}
.chip .run{position:absolute;bottom:-6px;width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.85);opacity:0;transition:opacity .3s}
.chip.on .run{opacity:1}
.chip.bounce .dot{animation:dockBounce .7s var(--ease)}
.chip .lab{display:none}
img.ico{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.55))}
.dot.img{background:linear-gradient(160deg,#3a4a70,#151d33);box-shadow:0 0 0 .5px rgba(255,255,255,.18) inset,0 2px 6px rgba(0,0,0,.4);padding:3px}

/* ===== popover ===== */
#pop{position:absolute;z-index:5;width:300px;background:rgba(22,26,38,.42);backdrop-filter:blur(3px) saturate(140%);-webkit-backdrop-filter:blur(3px) saturate(140%);text-shadow:0 1px 3px rgba(0,0,0,.65);border-radius:14px;
  box-shadow:0 0 0 .5px rgba(255,255,255,.17) inset,0 0 0 .5px rgba(0,0,0,.6),0 22px 60px rgba(0,0,0,.5);display:none;overflow:hidden;opacity:0;transform:scale(.92) translateY(6px);transition:opacity .22s var(--ease),transform .38s var(--spring)}
#pop.show{opacity:1;transform:none}
#pop:hover{background:rgba(26,30,42,.9);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%)}
#pop{transition:background .25s var(--ease)}
#pop.glide{transition:background .25s var(--ease),opacity .22s var(--ease),transform .38s var(--spring),left .55s var(--ease),top .55s var(--ease)}
#leader{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;overflow:visible;opacity:0;transition:opacity .3s var(--ease)}
#leader.on{opacity:1}
#leader .ln{fill:none;stroke:#ffd23f;stroke-width:2;stroke-linecap:round;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
#leader .dt{fill:#ffd23f;stroke:#1c1c20;stroke-width:1.5}
#leader .rg{fill:none;stroke:#ffd23f;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ring 1.6s var(--ease) infinite}
#leader .tip{fill:#ffd23f}
@keyframes ring{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.6);opacity:0}}
#pop .ph{padding:13px 14px 10px;border-bottom:.5px solid var(--sep);position:relative}
#pop .tag{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;color:var(--text2)}
#pop .tag img{width:18px;height:18px;object-fit:contain}
#pop h4{font-size:15px;font-weight:700;line-height:1.25;margin-top:5px;padding-right:24px;letter-spacing:-.2px}
#pop .org{font-size:12px;color:var(--text2);margin-top:2px}
#pop .x{position:absolute;right:9px;top:9px;width:22px;height:22px;border-radius:50%;font-size:11px;color:var(--text2);background:var(--fill2);display:grid;place-items:center}
#pop .pb{padding:10px 14px 12px;max-height:230px;overflow-y:auto}
#pop .lab{font-size:10.5px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
#pop ul{list-style:none;display:flex;flex-direction:column;gap:6px}
#pop li{font-size:13px;line-height:1.45;padding-left:15px;position:relative;color:#e5e5ea}
#pop li::before{content:"";position:absolute;left:2px;top:7px;width:6px;height:6px;border-radius:50%;background:var(--c)}
#pop li.key{font-weight:600;color:#fff}
#pop .decode{margin-top:8px;font-size:12px;line-height:1.5;background:rgba(255,214,10,.1);border-radius:9px;padding:8px 10px;color:#f3e3a8;box-shadow:0 0 0 .5px rgba(255,214,10,.25) inset}
#pop .pa{display:flex;gap:6px;padding:0 12px 12px}
#pop .pa.top{padding-bottom:6px}
#pop .pa button{flex:1;padding:7px 6px;border-radius:8px;font-size:12px;font-weight:600;background:var(--fill2);transition:background .2s,transform .15s var(--spring)}
#pop .pa button:hover{background:rgba(255,255,255,.17)}
#pop .pa button:active{transform:scale(.95)}
#pop .pa button.primary{background:var(--accent);color:#fff}
#pop .pa button.alt{background:rgba(10,132,255,.18);color:#64b5ff}

/* ===== inspector ===== */
#panel{min-height:0;overscroll-behavior:contain;background:rgba(28,28,32,.72);border-left:.5px solid rgba(0,0,0,.6);box-shadow:inset .5px 0 0 rgba(255,255,255,.06);overflow-y:auto;overflow-x:hidden;min-width:0}
.pad{padding:22px 22px 30px;width:372px}
.pad.in{animation:panelIn .42s var(--ease)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--text2);display:flex;align-items:center;gap:7px}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.back{font-size:13px;font-weight:500;color:var(--accent);display:inline-flex;gap:4px;margin-bottom:12px;padding:2px 0}
.back:hover{opacity:.8}
h2{font-size:24px;font-weight:700;letter-spacing:-.6px;margin:6px 0 8px;line-height:1.15}
h2 .hico{display:inline-grid;width:40px;height:40px;vertical-align:-10px;margin-right:8px}
.lead{font-size:14px;line-height:1.6;color:#d1d1d6}
h3{font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--text3);margin:22px 0 9px}
ul.list{list-style:none;display:flex;flex-direction:column;gap:7px}
ul.list li{font-size:13.5px;line-height:1.5;padding-left:18px;position:relative;color:#e5e5ea}
ul.list li::before{content:"";position:absolute;left:4px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--c)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.card{background:var(--fill);border-radius:10px;padding:10px 12px;text-align:left;font-size:13px;font-weight:600;line-height:1.3;box-shadow:0 0 0 .5px rgba(255,255,255,.06) inset;transition:background .2s var(--ease),transform .25s var(--spring)}
.card:hover{background:var(--fill2)}
.card:active{transform:scale(.97)}
.card small{display:block;font-weight:400;color:var(--text2);font-size:11.5px;margin-top:3px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12px;font-weight:500;padding:5px 10px;border-radius:999px;background:var(--fill);display:inline-flex;gap:6px;align-items:center;transition:background .2s}
.pill:hover{background:var(--fill2)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--pc)}
.fact{background:rgba(255,214,10,.08);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.55;color:#eadfb8;margin-top:18px;box-shadow:0 0 0 .5px rgba(255,214,10,.2) inset}
.fact b{display:block;font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;margin-bottom:4px;color:#ffd60a;font-weight:600}
.where{display:flex;gap:10px;background:var(--fill);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.5;margin-top:4px;color:#e5e5ea}
.selpart{display:flex;gap:10px;align-items:center;background:rgba(10,132,255,.14);box-shadow:0 0 0 .5px rgba(10,132,255,.45) inset;border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600;margin-bottom:10px;color:#9fd0ff}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.btn{padding:7px 13px;border-radius:8px;font-size:13px;font-weight:500;background:var(--fill2);display:inline-flex;align-items:center;gap:6px;box-shadow:0 0 0 .5px rgba(255,255,255,.08) inset;transition:background .2s,transform .2s var(--spring)}
.btn:hover{background:rgba(255,255,255,.17)}
.btn:active{transform:scale(.95)}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:22px;padding-top:16px;border-top:.5px solid var(--sep)}
.nav .btn{flex:1;justify-content:center;font-size:12px}
.sysgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.sysgrid .card{display:flex;gap:10px;align-items:center}
.sysgrid .card .dot{width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center}
.search{position:relative;margin-top:14px}
.search input{width:100%;border:0;border-radius:9px;padding:8px 12px 8px 32px;font-size:13.5px;outline:none;background:rgba(0,0,0,.3);box-shadow:0 0 0 .5px rgba(255,255,255,.1) inset;transition:box-shadow .25s var(--ease)}
.search input::placeholder{color:var(--text3)}
.search input:focus{box-shadow:0 0 0 .5px rgba(255,255,255,.1) inset,0 0 0 3.5px rgba(10,132,255,.55)}
.search::before{content:"";position:absolute;left:11px;top:50%;width:11px;height:11px;margin-top:-7px;border:1.6px solid var(--text2);border-radius:50%}
.search::after{content:"";position:absolute;left:21px;top:50%;width:5px;height:1.6px;margin-top:4px;background:var(--text2);transform:rotate(45deg)}
.results{display:flex;flex-direction:column;gap:1px;margin-top:6px}
.res{display:flex;align-items:center;gap:9px;text-align:left;padding:7px 10px;border-radius:7px;font-size:13px;animation:fadeIn .3s var(--ease) both}
.res:hover{background:var(--accent);color:#fff}
.res:hover small{color:rgba(255,255,255,.8)}
.res i{width:8px;height:8px;border-radius:50%;background:var(--pc);flex:none}
.res small{color:var(--text2);margin-left:auto;font-size:11px;white-space:nowrap}
.qbox{background:var(--fill);border-radius:14px;padding:16px;margin-top:12px;box-shadow:0 0 0 .5px rgba(255,255,255,.06) inset}
.qtype{font-size:10.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--text2)}
.qtext{font-size:16px;font-weight:700;line-height:1.4;margin:6px 0 14px;letter-spacing:-.2px}
.qtext span{color:#d1d1d6!important}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{background:rgba(255,255,255,.07);border-radius:10px;padding:10px 13px;text-align:left;font-size:13.5px;font-weight:500;box-shadow:0 0 0 .5px rgba(255,255,255,.08) inset;transition:background .2s,transform .2s var(--spring)}
.opt:hover{background:rgba(255,255,255,.13)}
.opt:active{transform:scale(.98)}
.opt.right{background:rgba(48,209,88,.2);box-shadow:0 0 0 1px rgba(48,209,88,.6) inset}
.opt.wrong{background:rgba(255,69,58,.18);box-shadow:0 0 0 1px rgba(255,69,58,.55) inset}
.score{display:flex;gap:6px}
.score div{flex:1;background:var(--fill);border-radius:10px;padding:9px;text-align:center;font-size:10.5px;font-weight:500;color:var(--text2)}
.score div b{display:block;font-size:19px;color:var(--text);font-weight:700}
.feedback{margin-top:12px;font-size:13px;line-height:1.5;font-weight:500;padding:10px 12px;border-radius:10px;animation:popIn .4s var(--spring)}
.feedback.ok{background:rgba(48,209,88,.15);color:#7ee09a}.feedback.no{background:rgba(255,69,58,.15);color:#ff8a80}
.tapcue{background:rgba(0,0,0,.2);border:1px dashed rgba(255,255,255,.2);border-radius:10px;padding:12px;font-size:13px;color:var(--text2)}
.note{color:var(--text3);font-size:11.5px;line-height:1.5;margin-top:14px}

/* ===== slice bars ===== */
#slicebar,.cuslice{position:absolute;left:50%;transform:translateX(-50%) translateY(12px);display:flex;align-items:center;gap:10px;border-radius:13px;padding:6px 8px 6px 12px;color:var(--text);font-size:12.5px;font-weight:600;z-index:4;opacity:0;pointer-events:none;transition:opacity .3s var(--ease),transform .45s var(--spring)}
#slicebar{bottom:96px}.cuslice{bottom:14px}
#slicebar.on,.cuslice.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
input[type=range]{-webkit-appearance:none;appearance:none;width:200px;height:4px;border-radius:4px;background:rgba(255,255,255,.2);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#f5f5f7;box-shadow:0 1px 4px rgba(0,0,0,.5),0 0 0 .5px rgba(0,0,0,.2)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#f5f5f7;border:0}
.seg2{display:flex;background:rgba(0,0,0,.28);border-radius:8px;padding:2px}

    case 'respiratory': return o === 'lungs' ? 'lung' : /trachea|bronchi|larynx/.test(o) ? 'cartilage' : o === 'diaphragm' ? 'muscle' : 'mucosa';
    case 'digestive': return o === 'teeth' ? 'tooth' : /liver|pancreas|gallbladder|salivary/.test(o) ? 'organ' : o === 'mouth' ? 'mucosa' : 'gut';

/* ============ ORGANS REGISTRY ============ */

/* ============ LOADING ============ */
const loaderEl = document.getElementById('loader'), loadTxt = document.getElementById('loadTxt'), loadBar = document.getElementById('loadBar');

  loadQueue += f ? f.bytes : 0;
  loading[s] = (async () => {
    await Promise.all((DEPS[s] || []).map(ensureSys));
    if (f) { const buf = await fetchBuf(f.url, SYS[s].name, f.bytes); buildSystem(s, buf); }

    loaded[s] = true; buildShares();

/* ============ PROCEDURAL (structures missing from the scan data) ============ */
function procMesh(org, geo, color, name, { pos, scale, rot, sex, opts } = {}) {

  const pc = h.object.userData.piece; tip.textContent = cap(pc.p.n); tip.style.display = 'block'; tip.style.transform = `translate(${e.clientX - r.left + 14}px,${e.clientY - r.top + 12}px)`; renderer.domElement.style.cursor = 'pointer';
}
document.getElementById('luBack').onclick = () => luExit();
document.getElementById('tLineup').onclick = () => luEnter();

/* ============ LIFT (selected part pops out, big) ============ */
const liftScene = new THREE.Scene(); liftScene.environment = scene.environment;
liftScene.add(key.clone(), rim.clone(), new THREE.HemisphereLight(0xffffff, 0x223355, 0.35));
const LIFT = { mesh: null, glow: null, p: null, org: null, t0: 0, dir: 1, from: new THREE.Vector3(), fromS: 1, center: new THREE.Vector3(), box: new THREE.Box3(), r0: 1, spin: 0 };
const glowTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'); const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64); gr.addColorStop(0, 'rgba(120,180,255,.55)'); gr.addColorStop(.45, 'rgba(70,120,230,.22)'); gr.addColorStop(1, 'rgba(40,70,160,0)'); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c); })();
function liftRemove() { if (LIFT.mesh) { liftScene.remove(LIFT.mesh, LIFT.glow); if (LIFT.own) LIFT.mesh.geometry.dispose(); } LIFT.mesh = null; LIFT.glow = null; LIFT.p = null; }
function liftStart(p, org, src) {
  liftRemove(); if (state.slice || !src) return false;
  let geo, from, own = false;
  if (src.userData.piece) { geo = src.geometry; from = src.position.clone(); }
  else { if (src.isInstancedMesh) return false; const cp = compactPart(p, src); geo = cp.g; from = cp.c; own = true; }
  if (!geo.boundingSphere) geo.computeBoundingSphere();
  const mat = makeMat(org.sys, { org: (src.userData.org || org).id }); const m = new THREE.Mesh(geo, mat); m.renderOrder = 9; m.position.copy(from); m.userData.lift = true;
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, transparent: true, depthWrite: false, depthTest: false, opacity: 0 })); glow.renderOrder = 8;
  liftScene.add(glow, m);
  Object.assign(LIFT, { mesh: m, glow, p, org, own, t0: performance.now(), dir: 1, from, r0: Math.max(geo.boundingSphere.radius, 1e-4), spin: 0 });
  liftPose(); state.anchorW = LIFT.center; state.selBox = LIFT.box; return true;
}
function liftEnd() { if (!LIFT.mesh || LIFT.dir < 0) return; LIFT.dir = -1; LIFT.t0 = performance.now(); }
function liftPose() {
  // target: in front of the camera, a bit left of centre so the popup fits beside it
  const D = Math.max(.15, camera.position.distanceTo(controls.target) * .55), th = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2);
  const wide = innerWidth > 900, R = D * th * (wide ? .3 : .26);
  const local = new THREE.Vector3(wide ? -D * th * camera.aspect * .2 : 0, wide ? -D * th * .02 : D * th * .18, -D);
  LIFT.target = camera.localToWorld(local); LIFT.scale = R / LIFT.r0;
  LIFT.box.setFromCenterAndSize(LIFT.target, new THREE.Vector3(R * 2, R * 2, R * 2));
}
function liftTick(now, dt) {
  if (!LIFT.mesh) return; liftPose();
  const t = Math.min(1, (now - LIFT.t0) / 750), k = easeIO(LIFT.dir > 0 ? t : 1 - t);
  const m = LIFT.mesh; m.position.lerpVectors(LIFT.from, LIFT.target, k);
  m.position.addScaledVector(camera.up, Math.sin(Math.PI * k) * LIFT.r0 * LIFT.scale * .25);
  const s = 1 + (LIFT.scale - 1) * k; m.scale.setScalar(s);
  LIFT.spin += dt * .45 * k; m.rotation.set(0, LIFT.spin, 0);
  LIFT.center.copy(m.position);
  LIFT.glow.position.copy(m.position).addScaledVector(camera.getWorldDirection(tmpV), LIFT.r0 * s * .6); LIFT.glow.scale.setScalar(LIFT.r0 * s * 3.6); LIFT.glow.material.opacity = k * .9;
  if (LIFT.dir < 0 && t >= 1) liftRemove();
}


/* ============ OFFLINE (service worker) ============ */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  const hadSW = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('message', ev => {
    if (ev.data && ev.data.type === 'offline-ready') toast(hadSW ? 'Corpara was updated — refresh to see the newest version.' : '✓ Ready for offline use. Corpara now works even without internet.');
  });
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

/* ============ MOVE PAD + KEYS ============ */
const padMove = { up: [0, 1], down: [0, -1], left: [-1, 0], right: [1, 0] };
let padHold = null;
function nudge(kind, dt = 1 / 60) {
  tween = null;
  const dist = camera.position.distanceTo(controls.target);
  if (padMove[kind]) {
    const [mx, my] = padMove[kind]; const sp = dist * 0.9 * dt;
    const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0), up = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);
    const d = right.multiplyScalar(-mx * sp).add(up.multiplyScalar(-my * sp)); // move the view, so content goes the other way
    d.negate(); camera.position.add(d); controls.target.add(d);
  } else if (kind === 'in' || kind === 'out') {
    const f = Math.pow(kind === 'in' ? 0.35 : 2.6, dt);
    const nd = Math.min(controls.maxDistance, Math.max(controls.minDistance, dist * f));
    camera.position.sub(controls.target).setLength(nd).add(controls.target);
  }
}
function padLoop(now) { if (!padHold) return; const dt = Math.min(.05, (now - padHold.t) / 1000); padHold.t = now; nudge(padHold.kind, dt); requestAnimationFrame(padLoop); }
document.querySelectorAll('#pad button').forEach(b => {
  const kind = b.dataset.m || b.dataset.z;
  b.addEventListener('pointerdown', e => { e.preventDefault(); if (kind === 'center') { frameCurrent(); return; } b.classList.add('held'); padHold = { kind, t: performance.now() }; nudge(kind, .08); requestAnimationFrame(padLoop); });
  const stop = () => { b.classList.remove('held'); padHold = null; };
  b.addEventListener('pointerup', stop); b.addEventListener('pointerleave', stop); b.addEventListener('pointercancel', stop);
});
const keyMap = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', '+': 'in', '=': 'in', '-': 'out', '_': 'out' };
const keysDown = new Set();
addEventListener('keydown', e => { if (!introDone || CU.open || /input|textarea/i.test(e.target.tagName)) return; const k = keyMap[e.key]; if (!k) return; e.preventDefault(); keysDown.add(k); });
addEventListener('keyup', e => { const k = keyMap[e.key]; if (k) keysDown.delete(k); });
addEventListener('blur', () => keysDown.clear());
let keyT = performance.now();
(function keyLoop(now) { requestAnimationFrame(keyLoop); const dt = Math.min(.05, (now - keyT) / 1000); keyT = now; for (const k of keysDown) nudge(k, dt); })(performance.now());
// Shift / Ctrl + left-drag pans (OrbitControls built-in); make it explicit for trackpads
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

/* ============ LOOP ============ */
function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage); resize();
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
let lastT = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  if (tween) { const t = Math.min(1, (now - tween.t0) / tween.dur), k = ease(t); camera.position.lerpVectors(tween.fromP, tween.toP, k); controls.target.lerpVectors(tween.fromT, tween.toT, k); if (t >= 1) { tween = null; if (pop.classList.contains('show')) placePop(false); } }
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now; stepFades(dt);
  const pulse = .5 + .5 * Math.sin(now / 200); hlU.uA.value = (LIFT.mesh ? .45 : .75) + .45 * pulse;
  if (CU.open) { CU.ctl.update(); CU.r.render(CU.scene, CU.cam); return; }
  luTick(now); liftTick(now, dt); luHover(); controls.update(); renderer.render(scene, camera); if (LIFT.mesh) { const cp = renderer.clippingPlanes; renderer.clippingPlanes = []; renderer.autoClear = false; renderer.clearDepth(); renderer.render(liftScene, camera); renderer.autoClear = true; renderer.clippingPlanes = cp; } updateLabels(); luLabels(); updateLeader(now);
}
requestAnimationFrame(loop);
window.__A = { ORG, ensureSys, scene, camera, controls, renderer, boxOf, flyToBox, refresh, state };

/* ============ BOOT ============ */
(async () => {
  showLoad('Loading anatomy data…');
  MAN = await (await fetch('data/manifest.json')).json();
  for (const e of MAN.parts) { const org = e.o || e.s + '_other'; const p = { ...e, org }; PARTS.push(p); const o = getOrg(org, e.s); o.parts.push(p); if (p.x) o.sexes.add(p.x); }
  for (const id of Object.keys(ORGANS)) { const o = getOrg(id, ORGANS[id].sys); if (o.share) o.parts = ORG[o.share] ? ORG[o.share].parts : []; }
  renderNav(); renderPanel();
  await ensureSys('integumentary'); await ensureSys('skeletal'); if (introDone) frameCurrent(); else { const wait = Math.max(0, INTRO_MIN - (performance.now() - introT0)); setTimeout(endIntro, wait); }
  ensureSys('all').then(() => { renderPanel(); });
})().catch(err => { loadTxt.textContent = 'Could not load the 3D data: ' + err.message; loaderEl.style.display = 'block'; console.error(err); });
